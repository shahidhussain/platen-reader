<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Platen Reader icon, "Spread" on apricot. Generated by make-icons.py. -->
  <defs>
    <linearGradient id="apricot-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd9b0"/>
      <stop offset="1" stop-color="#f2ae78"/>
    </linearGradient>
    <linearGradient id="apricot-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f3ead7"/>
    </linearGradient>
    <!-- shading at the spine, where the two pages meet -->
    <linearGradient id="apricot-spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a5a2a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7a5a2a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7a5a2a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="apricot-roller" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14181e"/>
      <stop offset="0.28" stop-color="#525a66"/>
      <stop offset="0.42" stop-color="#2b313a"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="apricot-knob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3acb7"/>
      <stop offset="1" stop-color="#434a54"/>
    </linearGradient>
    <!-- Two shadows: a tight one that defines the paper's edges against the
         background, and a soft, wider one that lifts it off. -->
    <filter id="apricot-shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#4a2600" flood-opacity="0.45" result="edge"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="28" result="blur"/>
      <feOffset in="blur" dy="22" result="offset"/>
      <feFlood flood-color="#4a2600" flood-opacity="0.45"/>
      <feComposite in2="offset" operator="in" result="soft"/>
      <feMerge>
        <feMergeNode in="soft"/>
        <feMergeNode in="edge"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#apricot-bg)"/>
  <!-- the open book: two pages, side by side -->
  <g filter="url(#apricot-shadow)">
    <rect x="248" y="250" width="528" height="430" rx="6" fill="url(#apricot-paper)"/>
  </g>
  <rect x="248.5" y="250.5" width="527" height="429" rx="6" fill="none" stroke="#b08a50" stroke-opacity="0.25"/>
  <rect x="482" y="250" width="60" height="430" fill="url(#apricot-spine)"/>
  <g fill="#c4b597">
    <rect x="286" y="318" width="186" height="16" rx="8"/><rect x="286" y="362" width="162" height="16" rx="8"/><rect x="286" y="406" width="186" height="16" rx="8"/><rect x="286" y="450" width="136" height="16" rx="8"/><rect x="286" y="494" width="174" height="16" rx="8"/><rect x="286" y="538" width="186" height="16" rx="8"/><rect x="286" y="582" width="120" height="16" rx="8"/><rect x="548" y="318" width="128" height="16" rx="8"/><rect x="548" y="362" width="128" height="16" rx="8"/><rect x="548" y="406" width="128" height="16" rx="8"/><rect x="548" y="450" width="150" height="16" rx="8"/><rect x="548" y="494" width="186" height="16" rx="8"/><rect x="548" y="538" width="178" height="16" rx="8"/><rect x="548" y="582" width="100" height="16" rx="8"/>
  </g>
  <!-- bookmark ribbon, hanging from the top of the right-hand page -->
  <path d="M690 250 L734 250 L734 384 L712 362 L690 384 Z" fill="#d0342c"/>
  <!-- the platen (roller) at the bottom, with its knobs -->
  <rect x="226" y="648" width="572" height="120" rx="60" fill="url(#apricot-roller)"/>
  <rect x="262" y="670" width="500" height="9" rx="4.5" fill="#ffffff" opacity="0.2"/>
  <rect x="170" y="656" width="78" height="104" rx="30" fill="url(#apricot-knob)"/>
  <rect x="776" y="656" width="78" height="104" rx="30" fill="url(#apricot-knob)"/>
</svg>
