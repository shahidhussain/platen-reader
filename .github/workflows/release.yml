# Builds a signed, notarised Platen Reader for a version tag and publishes
# it on GitHub releases.
#
# Start it by pushing a tag such as v0.1.0 (the version shown in the app is
# taken from the tag). To build an existing tag again, for example after a
# run was lost, run it by hand: gh workflow run release.yml -f tag=v0.1.0 It needs these repository secrets (README, "Releasing"):
#
#   DEVELOPER_ID_P12_BASE64    the Developer ID Application certificate and
#                              its private key, exported as .p12, base64
#   DEVELOPER_ID_P12_PASSWORD  the password chosen when exporting the .p12
#   APPLE_TEAM_ID              the ten-character team ID
#   ASC_KEY_P8_BASE64          an App Store Connect API key (.p8), base64
#   ASC_KEY_ID                 that key's ID
#   ASC_ISSUER_ID              the issuer ID shown above the list of keys
#
# Notarisation is Apple scanning the app and vouching for it, so that macOS
# opens it without a warning; stapling attaches that ticket to the app so it
# also works offline.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The existing tag to build and release, e.g. v0.1.0'
        required: true

permissions:
  contents: write # to create the release

jobs:
  release:
    runs-on: macos-15
    env:
      # The tag being released: the one pushed, or the one asked for.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Core unit tests
        run: swift test --package-path PlatenCore

      - name: Put the signing certificate in a temporary keychain
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN"
          # Let codesign use the key without a prompt.
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build and sign
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${TAG#v}"
          xcodebuild -project PlatenReader.xcodeproj -scheme PlatenReader \
            -configuration Release -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" OTHER_CODE_SIGN_FLAGS="--timestamp" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build
          codesign --verify --deep --strict --verbose=2 "build/DerivedData/Build/Products/Release/Platen Reader.app"

      - name: Notarise and staple
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          VERSION="${TAG#v}"
          APP="build/DerivedData/Build/Products/Release/Platen Reader.app"
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/upload.zip"
          xcrun notarytool submit "$RUNNER_TEMP/upload.zip" \
            --key "$KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --timeout 30m
          rm "$KEY"
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose "$APP"
          # The download: the stapled app, zipped.
          ditto -c -k --keepParent "$APP" "Platen-Reader-$VERSION.zip"
          shasum -a 256 "Platen-Reader-$VERSION.zip" | tee "Platen-Reader-$VERSION.zip.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          gh release create "$TAG" --verify-tag \
            "Platen-Reader-$VERSION.zip" "Platen-Reader-$VERSION.zip.sha256" \
            --title "Platen Reader $VERSION" --generate-notes

      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
