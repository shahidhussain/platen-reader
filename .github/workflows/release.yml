# Builds a signed, notarised Platen Reader for a version tag and publishes
# it on GitHub releases as a disk image (Platen-Reader-<version>.dmg).
#
# Start it by pushing a tag such as v1.0.5 (the version shown in the app is
# taken from the tag). A tag with a suffix, such as v1.0.5-rc1, makes a
# pre-release for testing the download: the app inside shows 1.0.5, and the
# release is marked as a pre-release so nobody takes it for the real one. To build an existing tag again, for example after a
# run was lost, run it by hand: gh workflow run release.yml -f tag=v0.1.0 It needs these repository secrets (README, "Releasing"):
#
#   DEVELOPER_ID_P12_BASE64    the Developer ID Application certificate and
#                              its private key, exported as .p12, base64
#   DEVELOPER_ID_P12_PASSWORD  the password chosen when exporting the .p12
#   APPLE_TEAM_ID              the ten-character team ID
#   ASC_KEY_P8_BASE64          an App Store Connect API key (.p8), base64
#   ASC_KEY_ID                 that key's ID
#   ASC_ISSUER_ID              the issuer ID shown above the list of keys
#   SPARKLE_ED_PRIVATE_KEY     Sparkle's private EdDSA key (generate_keys -x;
#                              docs/updates.md). Optional: without it the
#                              release has no appcast, and no update is offered
#
# Notarisation is Apple scanning the app and vouching for it, so that macOS
# opens it without a warning; stapling attaches that ticket to the app so it
# also works offline.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The existing tag to build and release, e.g. v0.1.0'
        required: true

permissions:
  contents: write # to create the release

jobs:
  release:
    runs-on: macos-15
    # Apple usually notarises in minutes, but a new developer account's first
    # submissions can take hours.
    timeout-minutes: 240
    env:
      # The tag being released: the one pushed, or the one asked for.
      TAG: ${{ inputs.tag || github.ref_name }}
    # (In each step: NAME is the tag without its "v", used in file names;
    # VERSION is that without any "-rc1" style suffix, the app's version.)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Core unit tests
        run: swift test --package-path PlatenCore

      - name: Put the signing certificate in a temporary keychain
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN"
          # Let codesign use the key without a prompt.
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build and sign
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          NAME="${TAG#v}"; VERSION="${NAME%%-*}"
          xcodebuild -project PlatenReader.xcodeproj -scheme PlatenReader \
            -configuration Release -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" OTHER_CODE_SIGN_FLAGS="--timestamp" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build
          APP="build/DerivedData/Build/Products/Release/Platen Reader.app"
          # Sparkle's helpers (the updater, its installer and downloader) are
          # signed again with our Developer ID, hardened runtime and a
          # timestamp, innermost first, then the app itself, as Sparkle's
          # documentation asks of builds made outside Xcode's Archive:
          # notarisation refuses them otherwise.
          FW="$APP/Contents/Frameworks/Sparkle.framework"
          if [ -d "$FW" ]; then
            SIGN=(codesign --force --sign "Developer ID Application" --options runtime --timestamp)
            "${SIGN[@]}" "$FW/Versions/B/XPCServices/Installer.xpc"
            "${SIGN[@]}" --preserve-metadata=entitlements "$FW/Versions/B/XPCServices/Downloader.xpc"
            "${SIGN[@]}" "$FW/Versions/B/Autoupdate"
            "${SIGN[@]}" "$FW/Versions/B/Updater.app"
            "${SIGN[@]}" "$FW"
            "${SIGN[@]}" --preserve-metadata=entitlements "$APP"
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Xcode adds get-task-allow (debugger access) unless told not to
          # (the setting above), and Apple refuses to notarise an app with it.
          if codesign -d --entitlements - "$APP" 2>/dev/null | grep -q get-task-allow; then
            echo "::error::The app still has the get-task-allow entitlement"; exit 1
          fi

      - name: Notarise and staple the app, then make and notarise the disk image
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          NAME="${TAG#v}"
          APP="build/DerivedData/Build/Products/Release/Platen Reader.app"
          DMG="Platen-Reader-$NAME.dmg"
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY"
          trap 'rm -f "$KEY"' EXIT
          AUTH=(--key "$KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID")

          # Sends a file to Apple and waits; on refusal prints Apple's log,
          # which says exactly what it objected to.
          notarise() {
            xcrun notarytool submit "$1" "${AUTH[@]}" \
              --wait --timeout 3h --output-format json | tee "$RUNNER_TEMP/notary.json"
            ID=$(plutil -extract id raw "$RUNNER_TEMP/notary.json")
            STATUS=$(plutil -extract status raw "$RUNNER_TEMP/notary.json")
            if [ "$STATUS" != "Accepted" ]; then
              xcrun notarytool log "$ID" "${AUTH[@]}"
              exit 1
            fi
          }

          # The app first, so the copy inside the image carries its own
          # ticket (it then opens offline even after being copied out).
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/upload.zip"
          notarise "$RUNNER_TEMP/upload.zip"
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose "$APP"

          # Then the image around it: signed, notarised and stapled too, so
          # opening the download gives no warning either.
          scripts/make-dmg.sh "$APP" "$DMG" "Developer ID Application"
          notarise "$DMG"
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose "$DMG"
          shasum -a 256 "$DMG" | tee "$DMG.sha256"

      - name: Sign the update and write the appcast
        # Sparkle (docs/updates.md): the disk image is signed with the
        # project's EdDSA key, and appcast.xml says it is the latest version.
        # Not for a test of the download (a suffixed tag), nor without the key.
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          NAME="${TAG#v}"; VERSION="${NAME%%-*}"
          case "$NAME" in *-*) echo "A test release: no appcast."; exit 0 ;; esac
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then echo "::warning::No SPARKLE_ED_PRIVATE_KEY: no appcast."; exit 0; fi
          # Sparkle's signing tool comes with the package Xcode fetched.
          SIGN=$(find build/DerivedData/SourcePackages/artifacts -name sign_update -type f -perm -u+x | head -1)
          if [ -z "$SIGN" ]; then echo "::error::sign_update not found (is the Sparkle package in the project?)"; exit 1; fi
          KEY="$RUNNER_TEMP/sparkle.key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEY"
          DMG="Platen-Reader-$NAME.dmg"
          # Prints: sparkle:edSignature="…" length="…"
          ATTRIBUTES=$("$SIGN" --ed-key-file "$KEY" "$DMG")
          rm "$KEY"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$DMG"
          NOTES="https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
          DATE=$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")
          MINIMUM=$(xcodebuild -project PlatenReader.xcodeproj -scheme PlatenReader -showBuildSettings 2>/dev/null \
            | awk '/ MACOSX_DEPLOYMENT_TARGET = / { print $3; exit }')
          # One item, the latest: Sparkle offers it to any older copy.
          cat > appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Platen Reader</title>
              <item>
                <title>Platen Reader $VERSION</title>
                <pubDate>$DATE</pubDate>
                <sparkle:version>$GITHUB_RUN_NUMBER</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>${MINIMUM:-14.0}</sparkle:minimumSystemVersion>
                <sparkle:releaseNotesLink>$NOTES</sparkle:releaseNotesLink>
                <enclosure url="$URL" type="application/octet-stream" $ATTRIBUTES />
              </item>
            </channel>
          </rss>
          XML
          cat appcast.xml

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="${TAG#v}"
          # A suffixed tag (v1.0.5-rc1) is a test of the download, not a release.
          case "$NAME" in *-*) PRE=--prerelease ;; *) PRE= ;; esac
          # The appcast, when one was made, goes with it: upload it to the
          # website (docs/updates.md, "Each release").
          FILES=("Platen-Reader-$NAME.dmg" "Platen-Reader-$NAME.dmg.sha256")
          [ -f appcast.xml ] && FILES+=(appcast.xml)
          gh release create "$TAG" --verify-tag $PRE "${FILES[@]}" \
            --title "Platen Reader $NAME" --generate-notes

      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
