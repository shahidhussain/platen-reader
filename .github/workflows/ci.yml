# Builds and tests Platen Reader on every push and pull request.
#
# Signed, notarised builds for version tags are made by release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Core unit and timing tests
        run: swift test --package-path PlatenCore

      - name: Build the app
        run: |
          xcodebuild -project PlatenReader.xcodeproj -scheme PlatenReader \
            -configuration Debug -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build

      - name: Build the iOS app (Simulator)
        run: |
          xcodebuild -project PlatenReader.xcodeproj -scheme "PlatenReader iOS" \
            -configuration Debug -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build

      - name: Generate the robustness corpus
        run: python3 scripts/make-fixtures.py

      # Opens every book in the corpus in the Debug build and checks what
      # happened (see scripts/check-corpus.sh). CI machines are slower than
      # a desk Mac, so each book gets longer to open.
      - name: Check the robustness corpus
        env:
          PLATEN_WAIT: "10"
        run: scripts/check-corpus.sh

      # Drives the real app through opening, page turns, layout and
      # bookmarks (PlatenReaderUITests). Its settings and positions go to a
      # throwaway folder.
      - name: UI tests
        run: |
          xcodebuild test -project PlatenReader.xcodeproj -scheme PlatenReader \
            -destination "platform=macOS" -derivedDataPath build/DerivedData \
            -only-testing:PlatenReaderUITests -resultBundlePath build/UITests.xcresult

      - name: Keep the snapshots, log and UI test results if a check failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/snaps
            build/app.log
            build/UITests.xcresult
          if-no-files-found: ignore
