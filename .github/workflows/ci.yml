# Builds and tests Platen Reader on every push and pull request.
#
# Signed, notarised builds for version tags are made by release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Core unit and timing tests
        run: swift test --package-path PlatenCore

      - name: Build the app
        run: |
          xcodebuild -project PlatenReader.xcodeproj -scheme PlatenReader \
            -configuration Debug -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build

      - name: Build the iOS app (Simulator)
        run: |
          xcodebuild -project PlatenReader.xcodeproj -scheme "PlatenReader iOS" \
            -configuration Debug -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build

      - name: Generate the robustness corpus
        run: python3 scripts/make-fixtures.py
